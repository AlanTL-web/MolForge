name: Linux CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q -o pythonpath=
      - run: python -m build
      - run: python scripts/build_command_reference.py --check
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: bash scripts/smoke_cli.sh
      - run: python scripts/package_release.py
